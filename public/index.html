<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabinet – Gestion</title>
<style>
:root{
  --ink:#1c2230; --ink2:#4a5263; --mute:#8a90a0; --line:#e3e1dc; --bg:#f6f4f0; --card:#fff;
  --navy:#1f2a44; --navy2:#2c3a5c; --accent:#8a2432; --accent-soft:#f6e9eb;
  --ok:#2f6b4a; --ok-soft:#e5f1ea; --warn:#9a6a12; --warn-soft:#fbf1dc; --bad:#a3302c; --bad-soft:#f9e4e2; --info-soft:#e6ebf5;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.layout{display:flex;min-height:100%}
nav.side{width:224px;flex:none;background:var(--navy);color:#dfe3ec;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:17px;color:#fff;letter-spacing:.2px}
.brand span{font-size:12px;color:#aab2c5}
nav.side a{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;color:#cfd5e2;text-decoration:none;border-left:3px solid transparent}
nav.side a:hover{background:rgba(255,255,255,.05)}
nav.side a.on{background:rgba(255,255,255,.08);border-left-color:#c9a45c;color:#fff}
nav.side .pill{background:#c9a45c;color:var(--navy);font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
nav.side .grow{flex:1}
nav.side .who{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#aab2c5}
nav.side .who button{background:none;border:0;color:#cfd5e2;padding:0;cursor:pointer;text-decoration:underline;margin-right:10px}
main{flex:1;min-width:0;padding:26px 32px 60px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:26px;margin:0}
h2{font-size:15px;margin:0 0 12px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.head .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c9c5bd}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#74202b}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.danger{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;overflow-x:auto}
.lines td.num{padding-top:12px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
.two{grid-template-columns:1fr 1fr}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:12px;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #efede8;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf9f6}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#eeece7;color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.info{background:var(--info-soft);color:var(--navy2)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--mute)} .small{font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff}
.filters input{min-width:240px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.empty{padding:28px;text-align:center;color:var(--mute)}
/* Formulaires */
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 2}
.f.s1{grid-column:span 1}.f.s3{grid-column:span 3}.f.s4{grid-column:span 4}.f.s6{grid-column:span 6}
@media (max-width:800px){.form{grid-template-columns:1fr}.f,.f.s1,.f.s3,.f.s4,.f.s6{grid-column:span 1}}
.f label{font-size:12px;color:var(--ink2);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;width:100%}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.filters input:focus{outline:2px solid #c9a45c55;border-color:#c9a45c}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;grid-column:1/-1;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0;margin-top:0}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.actions .sp{flex:1}
/* Lignes de devis / facture */
.lines td{padding:5px 6px;border-bottom:0}
.lines input,.lines select{border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;background:#fff}
.lines .q{width:80px}.lines .pu{width:130px}.lines .ty{width:130px}
.totals{margin-left:auto;width:320px;margin-top:10px}
.totals div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.totals .big{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:700;font-size:16px}
/* Fenêtre */
.overlay{position:fixed;inset:0;background:rgba(20,24,34,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.modal{background:#fff;border-radius:10px;width:100%;max-width:880px;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{font-family:Georgia,serif;font-weight:normal;font-size:21px;margin-bottom:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* Fiche dossier */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:8px 0;border-bottom:1px solid #efede8}
.timeline li:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}
.kv dt{color:var(--ink2);font-size:13px}.kv dd{margin:0}
.late{color:var(--bad);font-weight:600}
.soon{color:var(--warn);font-weight:600}
/* Connexion */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy)}
.login .card{width:360px;padding:28px}
.login h1{font-size:24px;margin-bottom:4px}
.login .f{margin-top:12px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
@media (max-width:760px){nav.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;z-index:10}
  .brand,.who,nav.side .grow{display:none} nav.side a{border-left:0;border-top:3px solid transparent;padding:12px 14px;white-space:nowrap}
  nav.side a.on{border-top-color:#c9a45c} main{padding:18px 14px 90px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/jspdf.js"></script>
<script src="/app.js"></script>
</body>
</html>
